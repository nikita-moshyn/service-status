name: Status pipeline
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      runChecks:
        description: Perform actual readiness checks
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['config/**', 'data/editorial.json', 'shared/**', 'lib/**', 'web/**', 'scripts/**', 'package*.json', '.github/workflows/**', '.upptimerc.yml']
  workflow_run:
    workflows: [Upptime telemetry]
    branches: [main]
    types: [completed]
permissions: {}
# Both monitoring and publishing acquire this lock BEFORE checkout. Queue order
# is not assumed: every run checks out current main, never an event's old SHA.
concurrency:
  group: status-pipeline
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned release
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned release
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run configure -- --check
      - name: Check readiness and persist measurements
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.runChecks)
        run: |
          npm run monitor
          git config user.name 'service-status-bot'
          git config user.email 'service-status-bot@users.noreply.github.com'
          git add data/measurements.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record readiness measurements'
            # Preserve this actual sample, including a short outage, if an
            # administrator committed another file while checks were running.
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then pushed=true; break; fi
              git pull --rebase origin main
            done
            test "$pushed" = true
          fi
      - name: Validate all feeds and build candidate site
        run: npm run build
      - name: Refuse a superseded snapshot
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # pinned release
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          retention-days: 1
      - name: Recheck source immediately before deployment
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # pinned release
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
